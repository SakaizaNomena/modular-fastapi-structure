[project]
name = "modular-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sakaiza nomena", email = "sakaizanomena@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.165.0",
    "greenlet>=3.5.6",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
]

[project.scripts]
modular-api = "modular_api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
